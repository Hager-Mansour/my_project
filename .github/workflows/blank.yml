name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Show Files
      run: ls -la

    - name: Test Pipeline
      run: echo "Pipeline is working successfully 🚀"

    - name: Build Simulation
      run: |
        echo "Building project..."
        sleep 2
        echo "Build done ✅"
